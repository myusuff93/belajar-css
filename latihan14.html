<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>margin - 3 value</title>
    <style>
      p {
        margin: 10px 20px 30px;
        /* Jika diberikan tiga nilai, nilai pertama berlaku untuk margin atas, nilai kedua untuk margin kiri dan kanan, dan nilai ketiga untuk margin bawah. */

        /* Ini mengatur margin menjadi 10px untuk bagian atas, 20px untuk bagian kiri dan kanan, serta 30px untuk bagian bawah. */
      }
    </style>
  </head>
  <body>
    <span>Paragraph one</span>
    <p>Paragraph two</p>
    <span>Paragraph three</span>
  </body>
</html>
