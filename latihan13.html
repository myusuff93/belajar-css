<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Latihan 13 - margin shorthand</title>
    <style>
      p {
        margin: 10px;
        /* apply 10px of margin equally to all four sides of the paragraph element */
      }
    </style>
  </head>
  <body>
    <h1>Belajar margin padding</h1>
    <hr />

    <span>Paragraph one</span>

    <p>Paragraph two</p>

    <span>Paragraph three</span
  </body>
</html>
